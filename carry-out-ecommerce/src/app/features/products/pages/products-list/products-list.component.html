<p>cantidad: {{ myShoppingCart.length}}</p>
<p>total: ${{ total() }}</p>
<button (click)="createNewProduct()">Click Create!</button>
<button (click)="onShowDetail('696969')">Detail Not Found!!</button>

<div class="container">
  <div class="box-area"></div>
  <app-product
    [product]="product"
    *ngFor="let product of products()"
    (addToCartProduct)="onAddToShoppingCart($event)"
    (showDetailProduct)="onShowDetail($event)"
  ></app-product>
  <button (click)="loadMore()">ver mas</button>
</div>

<div class="product-detail" [class.active]="showProductDetail" >
  <div *ngIf="productChosen">
    <button (click)="toggleproductDetail()">close</button>
    {{ statusDetail }}
    <div class="container-detail">
      <h1>{{ productChosen.title }}</h1>
      <div class="detail-container">
        <swiper-container>
          <swiper-slide *ngFor="let image of productChosen.images" class="swiper-slide">
            <img [src]="image" alt="" />
          </swiper-slide>
          <div class="swiper-pagination"></div>
          <div class="swiper-button-next"></div>
          <div class="swiper-button-prev"></div>
        </swiper-container>
        <p>{{ productChosen.description}}</p>
        <button (click)="updateProduct()">Editar</button>
        <button (click)="deleteProduct()">Eliminar</button>
      </div>
    </div>
  </div>
</div>
