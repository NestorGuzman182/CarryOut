<div class="container">
  <h1>Iniciar sesion</h1>
  <form #myForm="ngForm" (ngSubmit)="onLogin()">
    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" [(ngModel)]="login.email" required>
      <p class="error" *ngIf="!login.email || login.email.length <= 3">El email es requerido</p>
    </div>
    <div class="input-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" [(ngModel)]="login.password" required>
      <p class="error" *ngIf="!login.password">La contraseña es requerida</p>
    </div>
    <button class="btn primary"  type="submit" [disabled]="!myForm.valid">INICIAR SESION</button>
  </form>
  <button class="btn primary"  (click)="getProfile()">PERFIL</button>
</div>
